<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Code Trajectory · Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --claude:        rgb(215,119,87);
    --claude-shim:   rgb(245,149,117);
    --spinner-blue:  rgb(87,105,247);
    --success:       rgb(44,122,57);
    --error:         rgb(171,43,63);
    --warning:       rgb(150,108,30);
    --bg:            #0c0c0e;
    --bg-soft:       #15161a;
    --bg-card:       #1c1d22;
    --text:          #e7e7e9;
    --text-dim:      #9ca3af;
    --text-very-dim: #6b7280;
    --border:        #2a2c33;
    --user-prompt:   #d4d4d8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 13px;
    line-height: 1.55;
  }
  /* ===== App shell ===== */
  .shell {
    max-width: 980px;
    margin: 0 auto;
    padding: 16px 12px 80px;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding: 0 4px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .topbar .meta { display: flex; gap: 14px; }
  .topbar .meta b { color: var(--text); font-weight: 500; }
  .topbar .topbar-result.pass { color: var(--success); }
  .topbar .topbar-result.fail { color: var(--error); }
  /* ===== Welcome banner (boxed) ===== */
  .welcome {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin: 8px 0 14px;
    color: var(--text);
    background: var(--bg-soft);
    line-height: 1.6;
  }
  .welcome .star { color: var(--claude); font-weight: 700; margin-right: 6px; }
  .welcome .label { color: var(--text-dim); }
  .welcome .row { display: flex; gap: 6px; }
  .welcome .row + .row { margin-top: 1px; }
  /* ===== Message rows ===== */
  .row {
    display: grid;
    grid-template-columns: 18px 1fr;
    column-gap: 6px;
    margin: 12px 0 0;
    align-items: flex-start;
  }
  .row .glyph { color: var(--claude); font-weight: 700; line-height: 1.55; }
  .row.user .glyph { color: var(--text-dim); }
  .row.thinking .glyph { color: var(--text-dim); animation: pulse 2s infinite; }
  .row.tool-result .glyph { color: var(--text-dim); padding-left: 8px; }
  .row.tool-result { grid-template-columns: 26px 1fr; margin-top: 2px; }
  .row.tool-use .glyph { color: var(--claude); }
  .row.result-final .glyph { color: var(--success); }
  .row .body { white-space: pre-wrap; word-break: break-word; }
  .row.user .body { color: var(--user-prompt); }
  .row.tool-use .body .tool-name { font-weight: 700; color: var(--text); }
  .row.tool-use .body .tool-args { color: var(--text-dim); }
  .row.thinking .body { color: var(--text-dim); font-style: italic; }
  .row.tool-result .body { color: var(--text-dim); font-size: 12.5px; }
  .row.tool-result .body.is-error { color: var(--error); }
  .row.tool-result .more {
    display: inline-block;
    margin-top: 4px;
    padding: 0 6px;
    color: var(--text-very-dim);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
  }
  .row.tool-result .more:hover { color: var(--claude); border-color: var(--claude); }
  .row.thinking-collapsed { color: var(--text-dim); font-style: italic; cursor: pointer; }
  .row.thinking-collapsed:hover .body { color: var(--claude); }
  /* Markdown body */
  .md p { margin: 0 0 8px 0; }
  .md p:last-child { margin-bottom: 0; }
  .md code { background: var(--bg-card); padding: 1px 5px; border-radius: 3px; }
  .md pre {
    background: var(--bg-card);
    border-radius: 4px;
    padding: 10px 12px;
    margin: 6px 0;
    overflow-x: auto;
    font-size: 12px;
  }
  .md pre code { background: transparent; padding: 0; }
  .md ul, .md ol { margin: 4px 0; padding-left: 24px; }
  .md strong { color: var(--text); font-weight: 700; }
  .md em { color: var(--text-dim); }
  .md a { color: var(--claude); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  /* ===== Spinner ===== */
  .spinner-row {
    display: flex; gap: 8px; align-items: baseline;
    color: var(--text-dim);
    margin-top: 12px;
  }
  .spinner-row .glyph {
    color: var(--claude);
    width: 18px;
    display: inline-block;
    text-align: center;
  }
  .spinner-row .verb { color: var(--text); font-weight: 500; }
  .spinner-row .stats { color: var(--text-very-dim); }
  /* ===== Final result box ===== */
  .result-box {
    margin-top: 18px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-soft);
    color: var(--text-dim);
    font-size: 12px;
  }
  .result-box .stat { color: var(--text); font-weight: 500; }
  /* ===== Player ===== */
  .player {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(12,12,14,0.95);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 50;
  }
  .player button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }
  .player button:hover { border-color: var(--claude); color: var(--claude); }
  .player button.speed.active { border-color: var(--claude); color: var(--claude); }
  .player .scrub {
    flex: 1; height: 4px; background: var(--border); border-radius: 2px;
    cursor: pointer; position: relative;
  }
  .player .scrub-fill {
    height: 100%; background: var(--claude); border-radius: 2px;
    transition: width 60ms linear;
  }
  .player .step-info {
    color: var(--text-dim); font-size: 12px;
    min-width: 96px; text-align: right;
  }
  .empty {
    color: var(--text-dim);
    text-align: center; padding: 60px 20px;
  }
  .empty input {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 4px;
    width: 80%; max-width: 600px; font-family: inherit;
  }
  .empty button { margin-left: 8px; }
  body.embed .shell {
    max-width: none;
    padding: 12px 12px 72px;
  }
  body.embed .topbar {
    margin-bottom: 8px;
  }
  body.embed .welcome {
    margin-top: 0;
  }
  body.embed .player {
    padding: 8px 12px;
  }
  .case-browser {
    max-width: 920px;
    margin: 22px auto 0;
    text-align: left;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-soft);
    padding: 12px;
  }
  .case-controls {
    display: grid;
    grid-template-columns: 1fr 130px 160px 110px;
    gap: 8px;
    margin-bottom: 10px;
  }
  .case-controls input,
  .case-controls select {
    width: 100%;
    max-width: none;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 4px;
    font: inherit;
  }
  .case-count {
    color: var(--text-very-dim);
    font-size: 11px;
    margin-bottom: 8px;
  }
  .case-list {
    max-height: 420px;
    overflow: auto;
    border-top: 1px solid var(--border);
  }
  .case-item {
    display: grid;
    grid-template-columns: 72px 132px 1fr 72px;
    gap: 10px;
    align-items: baseline;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .case-item:hover { background: var(--bg-card); color: var(--text); }
  .case-agent { color: var(--claude); font-weight: 700; }
  .case-domain { color: var(--text); }
  .case-task { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .case-result.pass { color: var(--success); }
  .case-result.fail { color: var(--error); }
  @media (max-width: 720px) {
    .case-controls { grid-template-columns: 1fr 1fr; }
    .case-item { grid-template-columns: 64px 1fr 56px; }
    .case-task { grid-column: 1 / -1; }
  }

  @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes spinPulse {
    0% { color: var(--claude); }
    50% { color: var(--claude-shim); }
    100% { color: var(--claude); }
  }
  .spin-anim { animation: spinPulse 1.6s infinite; }
</style>
</head>
<body>
<script>
  if (new URLSearchParams(window.location.search).get('embed') === '1') {
    document.body.classList.add('embed');
  }
</script>
<div class="shell">
  <div class="topbar">
    <div class="meta">
      <span><b id="meta-domain">—</b> / <span id="meta-task">—</span></span>
      <span>model: <b id="meta-model">—</b></span>

    <div class="topbar-result" id="meta-result">—</div>

  <div id="stage"></div>

  <div id="empty-state" class="empty" style="display:none">
    <p>No trace loaded. Pass <code>?trace=PATH</code> in URL or pick a local case.</p>
    <p style="margin-top:20px">
      <button onclick="loadSample()">Load Claude demo (opus / os / 13584542)</button>

<div class="player" id="player" style="display:none">
  <button id="btn-play" title="Play/Pause [Space]">▶</button>
  <button id="btn-restart" title="Restart [R]">⟲</button>
  <div class="scrub" id="scrub"><div class="scrub-fill" id="scrub-fill" style="width:0"></div></div>
  <button class="speed" data-speed="1" title="1×">1×</button>

  <span class="step-info" id="step-info">0 / 0</span>
</div>

<script src="assets/marked.min.js"></script>
<script>
"use strict";

const MANIFEST_PATH = 'local_results/manifest.json';
let caseManifest = [];

// ===== Glyphs (from leaked figures.ts) =====
const G = {
  bullet: '⏺',
  thinking: '✻',
  tee: '⎿',
  user: '>',
  spinner: ['·', '✢', '✳', '✶', '✻', '✽'],
};
// Spinner verbs (subset from leaked spinnerVerbs.ts)
const VERBS = [
  'Accomplishing','Actioning','Architecting','Baking','Beaming','Brewing',
  'Calculating','Cascading','Cogitating','Computing','Concocting','Constructing',
  'Crafting','Creating','Deciphering','Designing','Devising','Discovering',
  'Distilling','Dreaming','Elaborating','Engineering','Envisioning','Evolving',
  'Examining','Excavating','Exploring','Fabricating','Finagling','Forging',
  'Generating','Hatching','Honing','Hustling','Imagining','Improvising',
  'Investigating','Iterating','Manifesting','Materializing','Mulling','Noodling',
  'Orchestrating','Percolating','Pondering','Processing','Producing','Reasoning',
  'Refining','Researching','Resolving','Riffing','Sculpting','Shaping',
  'Simmering','Solving','Spelunking','Spinning','Stewing','Strategizing',
  'Synthesizing','Thinking','Tinkering','Untangling','Wrestling','Wrangling',
];
const pickVerb = () => VERBS[Math.floor(Math.random() * VERBS.length)];

// ===== Trace parsing =====
async function loadTrace(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`fetch failed: ${path} → ${res.status}`);
  const text = await res.text();
  return text.split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(Boolean);
}
async function loadConfig(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

function detectTraceFormat(events, traceUrl = '') {
  if ((traceUrl || '').includes('codex_trace')) return 'codex';
  if ((traceUrl || '').includes('claude_trace')) return 'claude';
  if (events.some(e => String(e.type || '').startsWith('thread.') || String(e.type || '').startsWith('turn.') || e.type === 'item.started' || e.type === 'item.completed')) {
    return 'codex';
  }
  return 'claude';
}

// Normalize a claude_trace.jsonl array into a flat ordered list of
// "render events" (each becomes one row to play).
function normalizeClaude(events, taskInstr) {
  const out = [];
  let initialUserPushed = false;
  for (const e of events) {
    if (e.type === 'system' && e.subtype === 'init') {
      out.push({ kind: 'banner', model: e.model, cwd: e.cwd, session: e.session_id, ts: e.uuid });
      // First-turn user instruction shows up only as the agent's invocation prompt;
      // Claude Code CLI surfaces it as the leading "> ..." row.
      if (taskInstr && !initialUserPushed) {
        out.push({ kind: 'user', text: taskInstr });
        initialUserPushed = true;
      }
    } else if (e.type === 'rate_limit_event') {
      // skip — internal
    } else if (e.type === 'assistant') {
      const blocks = (e.message?.content || []);
      for (const b of blocks) {
        if (b.type === 'thinking') {
          const t = (b.thinking || '').trim();
          if (t) out.push({ kind: 'thinking', text: t });
        } else if (b.type === 'text') {
          const t = (b.text || '').trim();
          if (t) out.push({ kind: 'assistant_text', text: b.text });
        } else if (b.type === 'tool_use') {
          out.push({ kind: 'tool_use', name: b.name, input: b.input || {}, id: b.id });
        }
      }
    } else if (e.type === 'user') {
      const content = e.message?.content;
      if (Array.isArray(content)) {
        for (const b of content) {
          if (b && typeof b === 'object' && b.type === 'tool_result') {
            let payload = b.content;
            if (Array.isArray(payload)) {
              payload = payload.map(c => typeof c === 'string' ? c : (c?.text || JSON.stringify(c))).join('\n');
            } else if (typeof payload === 'object' && payload !== null) {
              payload = JSON.stringify(payload);
            }
            out.push({ kind: 'tool_result', text: String(payload || ''), isError: !!b.is_error, id: b.tool_use_id });
          }
        }
      }
    } else if (e.type === 'result') {
      out.push({ kind: 'result', text: e.result || '', turns: e.num_turns, cost: e.total_cost_usd, stop: e.stop_reason, duration: e.duration_ms });
    }
  }
  return out;
}

function normalizeCodex(events, taskInstr, cfg = {}, traceUrl = '') {
  const out = [];
  const started = new Set();
  const thread = events.find(e => e.type === 'thread.started');
  const usage = [...events].reverse().find(e => e.type === 'turn.completed')?.usage;
  const modelFromPath = inferModelFromPath(traceUrl);

  out.push({
    kind: 'banner',
    product: 'Codex CLI',
    model: cfg?.model || modelFromPath || 'codex',
    cwd: '/home/user',
    session: thread?.thread_id || '',
  });
  if (taskInstr) out.push({ kind: 'user', text: taskInstr });

  for (const e of events) {
    const item = e.item || {};
    if (e.type === 'item.completed' && item.type === 'agent_message') {
      const t = (item.text || '').trim();
      if (t) out.push({ kind: 'assistant_text', text: item.text });
    } else if (e.type === 'item.started' && item.type === 'command_execution') {
      started.add(item.id);
      out.push({ kind: 'tool_use', name: 'Bash', input: { command: item.command || '' }, id: item.id });
    } else if (e.type === 'item.completed' && item.type === 'command_execution') {
      if (!started.has(item.id)) {
        out.push({ kind: 'tool_use', name: 'Bash', input: { command: item.command || '' }, id: item.id });
      }
      out.push({
        kind: 'tool_result',
        text: formatCodexCommandResult(item),
        isError: item.status === 'failed' || (item.exit_code !== null && item.exit_code !== 0),
        id: item.id,
      });
    } else if (e.type === 'item.started' && item.type === 'web_search') {
      started.add(item.id);
      out.push({ kind: 'tool_use', name: 'WebSearch', input: { query: item.query || '', action: item.action || {} }, id: item.id });
    } else if (e.type === 'item.completed' && item.type === 'web_search') {
      if (!started.has(item.id)) {
        out.push({ kind: 'tool_use', name: 'WebSearch', input: { query: item.query || '', action: item.action || {} }, id: item.id });
      }
      out.push({ kind: 'tool_result', text: formatCodexGenericItem(item), isError: false, id: item.id });
    } else if ((e.type === 'item.started' || e.type === 'item.completed') && item.type === 'file_change') {
      if (e.type === 'item.started') {
        started.add(item.id);
        out.push({ kind: 'tool_use', name: 'FileChange', input: { changes: item.changes || [] }, id: item.id });
      } else {
        if (!started.has(item.id)) {
          out.push({ kind: 'tool_use', name: 'FileChange', input: { changes: item.changes || [] }, id: item.id });
        }
        out.push({ kind: 'tool_result', text: formatCodexFileChange(item), isError: item.status === 'failed', id: item.id });
      }
    } else if (e.type === 'item.completed' && item.type === 'error') {
      out.push({ kind: 'tool_result', text: `error: ${item.message || JSON.stringify(item)}`, isError: true, id: item.id });
    } else if ((e.type === 'item.started' || e.type === 'item.completed') && item.type) {
      if (e.type === 'item.started') {
        started.add(item.id);
        out.push({ kind: 'tool_use', name: item.type, input: item, id: item.id });
      } else {
        if (!started.has(item.id)) out.push({ kind: 'tool_use', name: item.type, input: item, id: item.id });
        out.push({ kind: 'tool_result', text: formatCodexGenericItem(item), isError: item.status === 'failed', id: item.id });
      }
    } else if (e.type === 'error') {
      out.push({ kind: 'tool_result', text: `error: ${e.message || JSON.stringify(e)}`, isError: true });
    } else if (e.type === 'turn.failed') {
      out.push({ kind: 'tool_result', text: `turn failed: ${e.error?.message || JSON.stringify(e.error || e)}`, isError: true });
    }
  }

  if (usage) {
    out.push({
      kind: 'result',
      text: '',
      turns: 1,
      cost: 0,
      stop: 'turn.completed',
      usage,
    });
  } else if (events.some(e => e.type === 'turn.failed')) {
    out.push({
      kind: 'result',
      text: '',
      turns: 1,
      cost: 0,
      stop: 'turn.failed',
    });
  }
  return out;
}

function inferModelFromPath(path) {
  const m = String(path || '').match(/\/screenshot\/([^/]+)\//);
  return m ? decodeURIComponent(m[1]) : '';
}

function formatCodexCommandResult(item) {
  const status = item.status || '?';
  const exitCode = item.exit_code === null || item.exit_code === undefined ? '?' : item.exit_code;
  const output = item.aggregated_output || '(no output)';
  return `status: ${status} · exit_code: ${exitCode}\n\n${output}`;
}

function formatCodexGenericItem(item) {
  return JSON.stringify(item, null, 2);
}

function formatCodexFileChange(item) {
  const changes = Array.isArray(item.changes) ? item.changes : [];
  const lines = changes.map(c => `${c.kind || 'change'} ${c.path || ''}`.trim());
  return `status: ${item.status || '?'}\n${lines.length ? lines.join('\n') : '(no file changes listed)'}`;
}

function normalizeTrace(events, taskInstr, cfg, traceUrl) {
  const format = detectTraceFormat(events, traceUrl);
  return {
    format,
    events: format === 'codex'
      ? normalizeCodex(events, taskInstr, cfg, traceUrl)
      : normalizeClaude(events, taskInstr),
  };
}

// ===== Renderers =====
function renderBanner(ev) {
  const el = document.createElement('div');
  el.className = 'welcome';
  const product = ev.product || 'Claude Code';
  const rows = [
    ['cwd:', ev.cwd || ''],
    ['model:', ev.model || ''],
    ['session:', ev.session ? `${String(ev.session).slice(0,8)}...` : ''],
  ].filter(([, value]) => value);
  el.innerHTML = `
    <div class="row" style="margin:0">
      <span><span class="star">${G.thinking}</span><b>Welcome to ${escapeHtml(product)}</b></span>
    </div>
    ${rows.map(([label, value]) => `<div class="row" style="margin:0"><span class="label">${escapeHtml(label)}</span><span>${escapeHtml(value)}</span></div>`).join('')}
  `;
  return el;
}
function renderUser(ev) {
  const el = document.createElement('div');
  el.className = 'row user';
  el.innerHTML = `<div class="glyph">${G.user}</div><div class="body" data-stream></div>`;
  return el;
}
function renderAssistantText(ev) {
  const el = document.createElement('div');
  el.className = 'row assistant';
  el.innerHTML = `<div class="glyph">${G.bullet}</div><div class="body md" data-stream-md></div>`;
  return el;
}
function renderThinking(ev) {
  const el = document.createElement('div');
  el.className = 'row thinking';
  el.innerHTML = `<div class="glyph">${G.thinking}</div><div class="body md" data-stream-md></div>`;
  return el;
}
function abbreviateArgs(name, input) {
  // Tool-specific brief renderings (modeled on claude-code's BashTool/Read/Edit UIs)
  if (!input || typeof input !== 'object') return '';
  if (name === 'Bash')   return abbreviateString(input.command || '', 90);
  if (name === 'Read')   return input.file_path || '';
  if (name === 'Edit')   return input.file_path || '';
  if (name === 'Write')  return input.file_path || '';
  if (name === 'Glob')   return input.pattern || '';
  if (name === 'Grep')   return input.pattern + (input.path ? ` in ${input.path}` : '');
  if (name === 'WebSearch') return input.query || JSON.stringify(input.action || {});
  if (name === 'FileChange') return (input.changes || []).map(c => `${c.kind || 'change'} ${c.path || ''}`.trim()).join(', ');
  // fallback: compact json, abbreviated
  return abbreviateString(JSON.stringify(input), 100);
}
function abbreviateString(s, n) {
  s = String(s || '');
  if (s.length <= n) return s;
  return s.slice(0, n - 1) + '…';
}
function renderToolUse(ev) {
  const el = document.createElement('div');
  el.className = 'row tool-use';
  const args = abbreviateArgs(ev.name, ev.input);
  el.innerHTML = `<div class="glyph">${G.bullet}</div>
    <div class="body"><span class="tool-name">${escapeHtml(ev.name)}</span>(<span class="tool-args">${escapeHtml(args)}</span>)</div>`;
  return el;
}
function renderToolResult(ev) {
  const el = document.createElement('div');
  el.className = 'row tool-result';
  const lines = ev.text.split('\n');
  const truncate = lines.length > 15;
  const head = lines.slice(0, 15).join('\n');
  const more = lines.length - 15;
  el.innerHTML = `<div class="glyph">${G.tee}</div>
    <div class="body${ev.isError ? ' is-error' : ''}"><span class="head">${escapeHtml(head)}</span>${truncate ? `<br><span class="more">+${more} lines (click to expand)</span>` : ''}</div>`;
  if (truncate) {
    const moreEl = el.querySelector('.more');
    moreEl.addEventListener('click', () => {
      el.querySelector('.head').textContent = ev.text;
      moreEl.remove();
    });
  }
  return el;
}
function renderResult(ev) {
  const el = document.createElement('div');
  el.className = 'result-box';
  const cost = (ev.cost || 0).toFixed(3);
  const dur = ev.duration ? `${(ev.duration / 1000).toFixed(1)}s` : '—';
  const usage = ev.usage ? ` · tokens: <span class="stat">${escapeHtml(formatUsage(ev.usage))}</span>` : '';
  el.innerHTML = `
    <div>turns: <span class="stat">${ev.turns ?? '—'}</span> ·
         cost: <span class="stat">$${cost}</span> ·
         duration: <span class="stat">${dur}</span> ·
         stop_reason: <span class="stat">${escapeHtml(ev.stop || '?')}</span>${usage}</div>
  `;
  // Final message
  const elText = document.createElement('div');
  elText.className = 'row result-final';
  const wrap = document.createDocumentFragment();
  if (ev.text) {
    elText.innerHTML = `<div class="glyph">${G.bullet}</div><div class="body md">${marked.parse(ev.text || '')}</div>`;
    wrap.appendChild(elText);
  }
  wrap.appendChild(el);
  return wrap;
}

function formatUsage(usage) {
  const parts = [];
  if (usage.input_tokens != null) parts.push(`in ${usage.input_tokens}`);
  if (usage.cached_input_tokens != null) parts.push(`cached ${usage.cached_input_tokens}`);
  if (usage.output_tokens != null) parts.push(`out ${usage.output_tokens}`);
  if (usage.reasoning_output_tokens != null) parts.push(`reasoning ${usage.reasoning_output_tokens}`);
  return parts.join(' / ');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== Player =====
const Player = {
  events: [],
  index: 0,
  speed: 1,                  // 0 = skip-to-end
  playing: false,
  spinner: null,
  charsPerSec: 60,           // base streaming rate
  rafId: null,
  lastTick: 0,
  inflightStream: null,      // {el, text, idx, isMd}
  totalChars: 0,             // sum of text lengths (for progress)
  charsDone: 0,

  init(events) {
    this.events = events;
    this.totalChars = events.reduce((acc, e) => acc + ((e.text || '').length || 60), 0);
    this.index = 0;
    this.charsDone = 0;
    this.playing = false;
    this.inflightStream = null;
    this.refreshUI();
  },
  refreshUI() {
    document.getElementById('player').style.display = this.events.length ? '' : 'none';
    document.getElementById('step-info').textContent = `${this.index} / ${this.events.length}`;
    document.getElementById('btn-play').textContent = this.playing ? '⏸' : '▶';
    document.getElementById('scrub-fill').style.width = (100 * this.charsDone / Math.max(1, this.totalChars)) + '%';
  },
  togglePlay() {
    if (this.index >= this.events.length && !this.inflightStream) return;
    this.playing = !this.playing;
    this.refreshUI();
    if (this.playing) this.tick();
  },
  setSpeed(s) {
    this.speed = s;
    if (s === 0) this.skipToEnd();
    else if (!this.playing) { this.playing = true; this.tick(); }
    document.querySelectorAll('.player .speed').forEach(b => b.classList.toggle('active', b.dataset.speed == s));
    this.refreshUI();
  },
  restart() {
    cancelAnimationFrame(this.rafId);
    this.removeSpinner();
    document.getElementById('stage').innerHTML = '';
    this.init(this.events);
  },
  skipToEnd() {
    cancelAnimationFrame(this.rafId);
    this.removeSpinner();
    while (this.index < this.events.length) {
      this.renderEvent(this.events[this.index], /*instant=*/true);
      this.index++;
    }
    this.charsDone = this.totalChars;
    this.playing = false;
    this.inflightStream = null;
    this.refreshUI();
  },
  // Insert next event; for streamable kinds, set inflightStream and progress char-by-char
  advance() {
    this.removeSpinner();
    if (this.index >= this.events.length) { this.playing = false; this.refreshUI(); return; }
    const e = this.events[this.index];
    if (e.kind === 'assistant_text' || e.kind === 'thinking' || e.kind === 'user') {
      const node = (e.kind === 'user') ? renderUser(e) :
                   (e.kind === 'thinking') ? renderThinking(e) :
                                              renderAssistantText(e);
      const target = node.querySelector('[data-stream], [data-stream-md]');
      const isMd = node.querySelector('[data-stream-md]') != null;
      document.getElementById('stage').appendChild(node);
      this.inflightStream = { el: target, text: e.text, idx: 0, isMd };
      this.maybeShowSpinner(e);
    } else if (e.kind === 'result') {
      const frag = renderResult(e);
      document.getElementById('stage').appendChild(frag);
      this.charsDone += (e.text || '').length;
      this.index++;
      this.refreshUI();
      this.scrollToBottom();
      this.playing = false; // pause at end
    } else {
      // banner / tool_use / tool_result — render whole, with brief delay
      this.renderEvent(e, /*instant=*/false);
      this.index++;
      this.refreshUI();
      // brief between-event pause shown as spinner
      this.maybeShowSpinner(this.events[this.index]);
    }
    this.scrollToBottom();
  },
  renderEvent(e, instant) {
    const stage = document.getElementById('stage');
    let node;
    switch (e.kind) {
      case 'banner':       node = renderBanner(e); break;
      case 'user':         node = renderUser(e);   if (instant) node.querySelector('[data-stream]').textContent = e.text; break;
      case 'thinking':     node = renderThinking(e); if (instant) node.querySelector('[data-stream-md]').innerHTML = marked.parse(e.text); break;
      case 'assistant_text': node = renderAssistantText(e); if (instant) node.querySelector('[data-stream-md]').innerHTML = marked.parse(e.text); break;
      case 'tool_use':     node = renderToolUse(e); break;
      case 'tool_result':  node = renderToolResult(e); break;
      case 'result':       stage.appendChild(renderResult(e)); return;
      default: return;
    }
    stage.appendChild(node);
  },
  // Streamed character emission (called from rAF)
  tick() {
    if (!this.playing) return;
    const now = performance.now();
    if (!this.lastTick) this.lastTick = now;
    const dt = now - this.lastTick;
    this.lastTick = now;

    // If no inflight stream, advance to next event
    if (!this.inflightStream) {
      // tiny inter-event pause for tool_use/tool_result already rendered instantly
      this.advance();
      this.rafId = requestAnimationFrame(() => this.tick());
      return;
    }

    const s = this.inflightStream;
    const advanceChars = Math.max(1, Math.floor((this.charsPerSec * (this.speed || 1)) * dt / 1000));
    s.idx = Math.min(s.idx + advanceChars, s.text.length);
    if (s.isMd) {
      s.el.innerHTML = marked.parse(s.text.slice(0, s.idx));
    } else {
      s.el.textContent = s.text.slice(0, s.idx);
    }
    this.charsDone = Math.min(this.totalChars, this.charsDone + advanceChars);
    this.refreshUI();
    this.scrollToBottom();
    if (s.idx >= s.text.length) {
      this.inflightStream = null;
      this.index++;
      this.refreshUI();
    }
    this.rafId = requestAnimationFrame(() => this.tick());
  },
  maybeShowSpinner(nextEvent) {
    // Show spinner only if we're between events that suggest "agent is thinking"
    // i.e. before assistant.text or tool_use, *not* before tool_result
    if (!nextEvent) return;
    if (nextEvent.kind === 'tool_result' || nextEvent.kind === 'banner') return;
    const stage = document.getElementById('stage');
    const sp = document.createElement('div');
    sp.className = 'spinner-row';
    sp.id = '__spinner__';
    let i = 0;
    const verb = pickVerb();
    const start = performance.now();
    const tickSpinner = () => {
      if (!document.getElementById('__spinner__')) return;
      const elapsed = ((performance.now() - start) / 1000).toFixed(1);
      sp.innerHTML = `<span class="glyph spin-anim">${G.spinner[i % G.spinner.length]}</span><span class="verb">${verb}…</span><span class="stats">(${elapsed}s · esc to interrupt)</span>`;
      i++;
      requestAnimationFrame(tickSpinner);
    };
    stage.appendChild(sp);
    this.spinner = sp;
    requestAnimationFrame(tickSpinner);
  },
  removeSpinner() {
    const sp = document.getElementById('__spinner__');
    if (sp) sp.remove();
    this.spinner = null;
  },
  scrollToBottom() {
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
  },
};

// ===== Entry =====
async function loadFromUrl(traceUrl, configUrl, resultUrl) {
  cancelAnimationFrame(Player.rafId);
  Player.removeSpinner();
  document.getElementById('stage').innerHTML = '';
  document.getElementById('empty-state').style.display = 'none';
  const events = await loadTrace(traceUrl);
  const cfg = configUrl ? await loadConfig(configUrl) : null;
  let result = '?';
  if (resultUrl) {
    try { const r = await fetch(resultUrl); if (r.ok) result = (await r.text()).trim(); } catch {}
  }
  const normalized = normalizeTrace(events, cfg?.instruction || '', cfg || {}, traceUrl);
  const norm = normalized.events;
  // Topbar
  const initEv = events.find(e => e.type === 'system' && e.subtype === 'init');
  const threadEv = events.find(e => e.type === 'thread.started');
  document.getElementById('meta-domain').textContent = cfg?.snapshot || cfg?.domain || '?';
  document.getElementById('meta-task').textContent = (cfg?.id || '').slice(0,8) + '…';
  document.getElementById('meta-model').textContent = initEv?.model || inferModelFromPath(traceUrl) || normalized.format;
  const mr = document.getElementById('meta-result');
  mr.textContent = `${normalized.format}${threadEv?.thread_id ? ` · ${threadEv.thread_id.slice(0,8)}` : ''} · result: ${result}`;
  mr.className = 'topbar-result ' + ((parseFloat(result) >= 0.99) ? 'pass' : (parseFloat(result) === 0 ? 'fail' : ''));

  Player.init(norm);
  // Auto-play
  setTimeout(() => Player.togglePlay(), 200);
}

async function loadManifest() {
  try {
    const res = await fetch(MANIFEST_PATH);
    if (!res.ok) return;
    caseManifest = await res.json();
    initCaseBrowser();
  } catch {
    // Manifest is generated after local result sync. Manual ?trace= still works.
  }
}

function initCaseBrowser() {
  const browser = document.getElementById('case-browser');
  const domainSelect = document.getElementById('case-domain');
  browser.style.display = '';
  const domains = [...new Set(caseManifest.map(c => c.domain).filter(Boolean))].sort();
  domainSelect.innerHTML = '<option value="">all domains</option>' + domains.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
  ['case-search', 'case-agent', 'case-domain', 'case-result'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderCaseList);
    document.getElementById(id).addEventListener('change', renderCaseList);
  });
  renderCaseList();
}

function renderCaseList() {
  const q = document.getElementById('case-search').value.trim().toLowerCase();
  const agent = document.getElementById('case-agent').value;
  const domain = document.getElementById('case-domain').value;
  const resultFilter = document.getElementById('case-result').value;
  let cases = caseManifest.filter(c => {
    if (agent && c.agent !== agent) return false;
    if (domain && c.domain !== domain) return false;
    if (resultFilter === 'pass' && !(parseFloat(c.result) >= 0.99)) return false;
    if (resultFilter === 'fail' && !(parseFloat(c.result) < 0.99)) return false;
    if (!q) return true;
    const hay = [c.agent, c.run, c.domain, c.model, c.task_id, c.instruction].join(' ').toLowerCase();
    return hay.includes(q);
  });
  cases = cases.slice(0, 500);
  document.getElementById('case-count').textContent = `${cases.length} shown / ${caseManifest.length} local traces`;
  document.getElementById('case-list').innerHTML = cases.map((c, i) => {
    const pass = parseFloat(c.result) >= 0.99;
    const task = `${c.run} · ${c.task_id} · ${c.instruction || ''}`;
    return `<div class="case-item" data-index="${i}">
      <div class="case-agent">${escapeHtml(c.agent)}</div>
      <div class="case-domain">${escapeHtml(c.domain || '?')}</div>
      <div class="case-task" title="${escapeHtml(task)}">${escapeHtml(task)}</div>
      <div class="case-result ${pass ? 'pass' : 'fail'}">${escapeHtml(String(c.result ?? '?'))}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.case-item').forEach((el, i) => {
    el.addEventListener('click', () => loadCase(cases[i]));
  });
}

function loadCase(c) {
  loadFromUrl(c.trace, c.config, c.result_file).catch(err => alert('load failed: ' + err.message));
}

// Player wiring
document.getElementById('btn-play').addEventListener('click', () => Player.togglePlay());
document.getElementById('btn-restart').addEventListener('click', () => Player.restart());
document.querySelectorAll('.player .speed').forEach(b => {
  b.addEventListener('click', () => Player.setSpeed(+b.dataset.speed));
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); Player.togglePlay(); }
  else if (e.code === 'KeyR') Player.restart();
  else if (e.code === 'Digit1') Player.setSpeed(1);
  else if (e.code === 'Digit2') Player.setSpeed(2);
  else if (e.code === 'Digit3') Player.setSpeed(4);
  else if (e.code === 'KeyE') Player.skipToEnd();
});
document.querySelectorAll('.player .speed[data-speed="1"]').forEach(b => b.classList.add('active'));

// URL: ?trace=PATH&config=PATH&result=PATH
const params = new URLSearchParams(location.search);
if (params.get('trace')) {
  loadFromUrl(params.get('trace'), params.get('config'), params.get('result'))
    .catch(err => { document.getElementById('empty-state').style.display=''; document.getElementById('empty-state').innerHTML += `<div style="color:var(--error)">${err.message}</div>`; });
} else {
  document.getElementById('empty-state').style.display = '';
  loadManifest();
}
